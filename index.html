<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Шрифт Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* Ваши стили остаются без изменений */
      :root {
        --accent: #8A8EE9;
        --accent-hover: #7075e2;
        --result-bg: #F0F1FD;
        --text-color: #111827;
        --muted: #6B7280;
        --error: #f97373;
        --error-bg: #FEF2F2;
      }

      body {
        font-family: "Nunito", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
        margin: 0;
        background: #ffffff;
        color: var(--text-color);
      }

      .layout {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }

      .calculator {
        flex: 1;
      }

      .tasks-panel {
        width: 260px;
      }

      .title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 24px;
        line-height: 1.25;
      }

      .title span {
        display: block;
        font-size: 18px;
        font-weight: 500;
        color: var(--muted);
        margin-top: 4px;
      }

      label {
        display: block;
        margin-top: 16px;
        margin-bottom: 4px;
        font-weight: 600;
      }

      input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-family: "Nunito";
      }

      input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(138, 142, 233, 0.25);
      }

      .input-error {
        border-color: var(--error);
        background: var(--error-bg);
      }

      .btn-primary {
        width: 100%;
        margin-top: 24px;
        padding: 12px 16px;
        font-size: 20px;
        font-weight: 700;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        font-family: "Nunito";
        box-shadow: 0 4px 10px rgba(138, 142, 233, 0.4);
        transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
        box-shadow: 0 5px 14px rgba(138, 142, 233, 0.55);
      }

      .btn-primary:active {
        transform: scale(0.97);
        box-shadow: 0 3px 8px rgba(138, 142, 233, 0.35);
      }

      .buttons-row {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .buttons-row .btn-primary {
        flex: 2;
        margin-top: 0;
      }

      .buttons-row .btn-secondary {
        flex: 1;
        margin-top: 0;
        padding: 12px 16px;
        font-size: 18px;
        font-weight: 700;
        border-radius: 10px;
        border: 2px solid var(--accent);
        background: #ffffff;
        color: var(--accent);
        cursor: pointer;
        font-family: "Nunito";
        box-shadow: 0 4px 10px rgba(138, 142, 233, 0.25);
        transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      .buttons-row .btn-secondary:hover {
        background: #F3F4FF;
        box-shadow: 0 5px 14px rgba(138, 142, 233, 0.35);
      }

      .buttons-row .btn-secondary:active {
        transform: scale(0.97);
        box-shadow: 0 3px 8px rgba(138, 142, 233, 0.25);
      }
      
      .result-box {
        margin-top: 24px;
        padding: 16px 18px;
        border-radius: 10px;
        background: var(--result-bg);
        line-height: 1.3;
        text-align: center;
        font-size: 18px;
      }

      .shake {
        animation: shake 0.35s ease;
      }

      @keyframes shake {
        0%   { transform: translateX(0); }
        20%  { transform: translateX(-4px); }
        40%  { transform: translateX(4px); }
        60%  { transform: translateX(-4px); }
        80%  { transform: translateX(4px); }
        100% { transform: translateX(0); }
      }

      .tasks-title {
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 16px;
      }

      .task-buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .task-btn {
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 10px;
        border: none;
        background: #ffffff;
        color: var(--text-color);
        cursor: pointer;
        text-align: center;
        font-family: "Nunito";
        box-shadow: 0 4px 10px rgba(138, 142, 233, 0.25);
        transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .task-btn:hover {
        background: #F3F4FF;
        box-shadow: 0 5px 14px rgba(138, 142, 233, 0.35);
      }

      .task-btn.active {
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 5px 14px rgba(138, 142, 233, 0.55);
      }

      .task-btn:active {
        transform: scale(0.97);
      }

      .task-box {
        padding: 14px 16px;
        border-radius: 10px;
        background: #F9FAFB;
        font-size: 14px;
        line-height: 1.4;
        font-family: "Nunito";
        min-height: 140px;
      }

      .task-line {
        margin-bottom: 6px;
      }

      .task-heading {
        text-align: center;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 15px;
      }

      @media (max-width: 700px) {
        .layout {
          flex-direction: column;
        }

        .tasks-panel {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <h1 class="title">
      Калькулятор накоплений
      <span>Выбери задание и впиши числа в строки калькулятора</span>
    </h1>

    <div class="layout">
      <!-- Левая часть: калькулятор -->
      <div class="calculator">
        <label>Цель, руб.</label>
        <input id="goal" type="number" min="0" />

        <label>Уже есть, руб.</label>
        <input id="have" type="number" min="0" />

        <label>Откладываю в день, руб.</label>
        <input id="perDay" type="number" min="0" />

        <!-- 🔄 ДВЕ КНОПКИ РЯДОМ -->
        <div class="buttons-row">
          <button class="btn-primary" onclick="calculate()">Рассчитать</button>
          <button class="btn-secondary" onclick="resetCalculator()">Сбросить</button>
        </div>

        <div id="result" class="result-box"></div>
      </div>

      <!-- Правая часть: задания -->
      <div class="tasks-panel">
        <div class="tasks-title">Задания</div>

        <div class="task-buttons">
          <button class="task-btn" data-task="task1" onclick="setTask('task1')">1 задание</button>
          <button class="task-btn" data-task="task2" onclick="setTask('task2')">2 задание</button>
          <button class="task-btn" data-task="mine" onclick="setTask('mine')">Мои накопления</button>
        </div>

        <div id="taskText" class="task-box"></div>
      </div>
    </div>

    <script>
      // Убираем Netlify функции и делаем расчет на клиенте
      function calculate() {
        const goalInput   = document.getElementById("goal");
        const haveInput   = document.getElementById("have");
        const perDayInput = document.getElementById("perDay");
        const resultBox   = document.getElementById("result");

        let goal   = goalInput.value.trim();
        let have   = haveInput.value.trim();
        let perDay = perDayInput.value.trim();

        // сбрасываем прошлую подсветку и шейк
        [goalInput, haveInput, perDayInput].forEach(inp =>
          inp.classList.remove("input-error")
        );
        resultBox.classList.remove("shake");

        // проверка на пустые поля
        let hasEmpty = false;
        if (goal === "") {
          goalInput.classList.add("input-error");
          hasEmpty = true;
        }
        if (have === "") {
          haveInput.classList.add("input-error");
          hasEmpty = true;
        }
        if (perDay === "") {
          perDayInput.classList.add("input-error");
          hasEmpty = true;
        }

        if (hasEmpty) {
          resultBox.innerHTML = "<b>Ой! Строки в калькуляторе не заполнены</b>";
          void resultBox.offsetWidth;
          resultBox.classList.add("shake");
          return;
        }

        // защита от отрицательных значений
        goal   = Math.max(0, Number(goal));
        have   = Math.max(0, Number(have));
        perDay = Math.max(0, Number(perDay));

        goalInput.value   = goal;
        haveInput.value   = have;
        perDayInput.value = perDay;

        // 🔄 РАСЧЕТ НА КЛИЕНТЕ (вместо Netlify функций)
        try {
          if (perDay === 0) {
            resultBox.innerHTML = "<b>Ошибка: сумма в день не может быть нулевой</b>";
            return;
          }

          const days = Math.ceil((goal - have) / perDay);
          
          if (days < 0) {
            resultBox.innerHTML = "<b>Ура! Цель уже достигнута 🎉</b>";
          } else {
            const totalSaved = have + (days * perDay);
            resultBox.innerHTML = 
              `Сколько дней копить: <b>${days}</b><br>` +
              `Накоплено всего: <b>${totalSaved} руб.</b>`;
          }
        } catch (error) {
          resultBox.innerHTML = `<b>Ошибка расчета: ${error.message}</b>`;
        }
      }

      function setTask(task) {
        const taskBox = document.getElementById("taskText");
        let html = "";

        if (task === "task1") {
          html =
            "<div class='task-heading'>Сколько дней будет копить Гриша?</div>" +
            "<div class='task-line'>Цель — 3 000&nbsp;руб.</div>" +
            "<div class='task-line'>Уже есть у Гриши — 600&nbsp;руб.</div>" +
            "<div class='task-line'>Гриша откладывает в день — 50 или 150&nbsp;руб.</div>" +
            "<div class='task-line'>Сколько дней копить — ?</div>";
        } else if (task === "task2") {
          html =
            "<div class='task-heading'>А теперь сколько дней будет копить Гриша?</div>" +
            "<div class='task-line'>Цель — 2 500&nbsp;руб.</div>" +
            "<div class='task-line'>Уже есть у Гриши — 450&nbsp;руб.</div>" +
            "<div class='task-line'>Гриша откладывает в день — 40&nbsp;руб.</div>" +
            "<div class='task-line'>Сколько дней копить — ?</div>";
        } else if (task === "mine") {
          html =
            "<div class='task-heading'>Сколько дней будешь копить ты?</div>" +
            "<div class='task-line'>1. Впиши сумму покупки, на которую ты копишь</div>" +
            "<div class='task-line'>2. Впиши, сколько у тебя уже накоплено</div>" +
            "<div class='task-line'>3. Впиши сумму, которую ты откладываешь в день</div>" +
            "<div class='task-line'>4. Нажми на кнопку «Рассчитать» и узнай, сколько дней ты будешь копить</div>";
        }

        taskBox.innerHTML = html;

        const buttons = document.querySelectorAll(".task-btn");
        buttons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.task === task);
        });
      }

      function resetCalculator() {
        document.getElementById("goal").value = "";
        document.getElementById("have").value = "";
        document.getElementById("perDay").value = "";
        document.getElementById("result").innerHTML = "";
        document.getElementById("goal").classList.remove("input-error");
        document.getElementById("have").classList.remove("input-error");
        document.getElementById("perDay").classList.remove("input-error");
        document.getElementById("result").classList.remove("shake");
        document.getElementById("goal").focus();
        console.log("Поля очищены!");
      }

      // Автоматически показываем первое задание
      setTask('task1');
    </script>
  </body>
</html>
